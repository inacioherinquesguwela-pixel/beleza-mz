<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beleza MZ 📷</title>
<style>
body{margin:0;font-family:sans-serif;background:#111;color:white;text-align:center}
h1{color:#ff2d78;margin:10px}
video{width:95%;max-width:500px;border-radius:15px;background:#000}
button{padding:14px 20px;margin:8px;border:none;border-radius:30px;font-size:16px;font-weight:bold}
#abrir{background:#ff2d78;color:white}
#tirar{background:white;color:black}
canvas{width:95%;max-width:500px;border-radius:15px;margin-top:10px}
select{padding:10px;border-radius:20px}
</style>
</head>
<body>
<h1>Beleza MZ 📷</h1>
<p>App de fotos de Moçambique</p>
<button id="abrir" onclick="abrir()">📷 Abrir Câmara</button><br>
<video id="v" autoplay playsinline muted></video><br>
<label>Filtro:</label>
<select id="filtro" onchange="document.getElementById('v').style.filter=this.value">
<option value="none">Normal</option>
<option value="grayscale(1)">Preto e Branco</option>
<option value="sepia(0.8)">Sépia</option>
<option value="contrast(1.3) saturate(1.5)">Vivo</option>
<option value="blur(1px) brightness(1.2)">Suave</option>
</select><br>
<button id="tirar" onclick="tirar()">📸 Tirar Foto</button>
<canvas id="c"></canvas>
<p id="msg"></p>
<script>
async function abrir(){
 try{
  const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false});
  document.getElementById('v').srcObject=s;
  document.getElementById('msg').innerText="Câmara aberta! Sorri 😍";
 }catch(e){ document.getElementById('msg').innerText="Erro: "+e.message+" - Usa HTTPS e permite a câmara"; }
}
function tirar(){
 const v=document.getElementById('v'),c=document.getElementById('c');
 c.width=v.videoWidth; c.height=v.videoHeight;
 const ctx=c.getContext('2d');
 ctx.filter=document.getElementById('filtro').value;
 ctx.drawImage(v,0,0);
 const a=document.createElement('a');
 a.download='beleza-mz.png'; a.href=c.toDataURL('image/png'); a.click();
 document.getElementById('msg').innerText="Foto guardada! 📸";
}
</script>
</body>
</html>
