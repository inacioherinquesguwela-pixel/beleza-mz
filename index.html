<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="IMG-20261118-WA0075.jpg">
<link rel="apple-touch-icon" href="IMG-20261118-WA0075.jpg">
<meta name="theme-color" content="#ff69b4">
<title>Beleza MZ</title>
<style>
body{background:#111;color:white;text-align:center;font-family:Arial}
h1{color:#ff2d78}
button{padding:15px 25px;border-radius:20px;border:none;margin:5px;font-weight:bold}
.rosa{background:#ff2d78;color:white}
.branco{background:white}
video{width:90%;border-radius:15px}
select{padding:10px;border-radius:10px}
</style>
</head>
<body>
<h1>Beleza MZ 📷</h1>
<p>Aplicativo de fotos de Moçambique</p>
<button class="rosa" onclick="abrir()">Abrir Câmera</button>
<br>
<button class="branco" onclick="usarFrente()">Frente</button>
<button class="branco" onclick="usarTras()">Trás</button>
<br><br>
<select id="filtro" onchange="document.getElementById('v').style.filter=this.value">
<option value="none">Sem filtro</option>
<option value="grayscale(1)">Preto e Branco</option>
<option value="sepia(0.8)">Sépia</option>
<option value="contrast(1.3) brightness(1.1)">Beleza</option>
<option value="saturate(1.8)">Vivo</option>
</select>
<br><br>
<video id="v" autoplay playsinline></video>
<br><br>
<button class="rosa" onclick="tirar()">Tirar Foto 📸</button>
<br><br>
<canvas id="c" style="display:none"></canvas>
<a id="baixar" style="display:none;color:#ff2d78">Baixar Foto</a>
<script>
let fluxo=null, frente=true;
async function abrir(){
  try{
    if(fluxo) fluxo.getTracks().forEach(t=>t.stop());
    let modo = frente?"user":"environment";
    fluxo = await navigator.mediaDevices.getUserMedia({video:{facingMode:modo}});
    let v=document.getElementById('v');
    v.srcObject=fluxo;
  }catch(e){ alert("Permite a câmera!"); }
}
function usarFrente(){ frente=true; abrir(); }
function usarTras(){ frente=false; abrir(); }
function tirar(){
  let v=document.getElementById('v');
  let c=document.getElementById('c');
  c.width=v.videoWidth; c.height=v.videoHeight;
  let ctx=c.getContext('2d');
  ctx.filter=document.getElementById('v').style.filter;
  if(frente){ctx.translate(c.width,0); ctx.scale(-1,1);}
  ctx.drawImage(v,0,0);
  let a=document.getElementById('baixar');
  a.href=c.toDataURL('image/png');
  a.download='beleza-mz.png';
  a.style.display='block';
}
</script>
</body>
</html>
