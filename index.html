<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff2d78">
<title>Beleza MZ</title>
<style>
body{background:#111;color:white;text-align:center;font-family:sans-serif}
h1{color:#ff2d78}
button{padding:15px 25px;border-radius:30px;border:none;font-size:18px;margin:5px}
.rosa{background:#ff2d78;color:white}
.branco{background:white}
video{width:90%;border-radius:15px;background:black}
select{padding:10px;border-radius:20px}
</style>
</head>
<body>
<h1>Beleza MZ 📷</h1>
<p>App de fotos de Moçambique</p>
<button class="rosa" onclick="abrir()">📷 Abrir Câmara</button>
<br>
<button class="branco" onclick="usarFrente()">🤳 Câmara Frontal</button>
<button class="branco" onclick="usarTras()">📸 Câmara Traseira</button>
<br><br>
<img id="capa" src="IMG-20261118-WA0075.jpg" style="width:90%;border-radius:15px">
<video id="v" autoplay playsinline></video>
<br><br>
Filtro: <select id="filtro">
<option value="none">Normal</option>
<option value="grayscale(1)">Preto e Branco</option>
<option value="sepia(1)">Antigo</option>
<option value="contrast(1.5)">Forte</option>
<option value="saturate(2)">Cores Fortes</option>
</select>
<br><br>
<button class="branco" onclick="tirar()">📸 Tirar Foto</button>
<br><br>
<canvas id="c" style="width:90%;border-radius:15px"></canvas>
<br>
<a id="baixar" style="display:none;color:white">⬇ Baixar Foto</a>
<script>
let stream=null;
let frente=true;
async function abrir(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  let modo = frente ? "user" : "environment";
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:modo}});
  }catch(e){
    stream = await navigator.mediaDevices.getUserMedia({video:true});
  }
  let v=document.getElementById('v');
  v.srcObject=stream;
  v.style.filter=document.getElementById('filtro').value;
}
function usarFrente(){ frente=true; abrir(); }
function usarTras(){ frente=false; abrir(); }
document.getElementById('filtro').onchange=function(){
  document.getElementById('v').style.filter=this.value;
}
function tirar(){
  let v=document.getElementById('v');
  let c=document.getElementById('c');
  c.width=v.videoWidth; c.height=v.videoHeight;
  let ctx=c.getContext('2d');
  ctx.filter=document.getElementById('filtro').value;
  if(frente){ctx.translate(c.width,0); ctx.scale(-1,1);}
  ctx.drawImage(v,0,0);
  let a=document.getElementById('baixar');
  a.href=c.toDataURL('image/png');
  a.download='beleza-mz.png';
  a.style.display='block';
}
</script>
</body>
</html>
